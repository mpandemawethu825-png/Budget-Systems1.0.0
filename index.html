<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBudget Pro — Glassmorphism Budget Calculator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        google: {
                            blue: '#1a73e8',
                            red: '#ea4335',
                            yellow: '#fbbc04',
                            green: '#34a853',
                            purple: '#a142f4'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
        }

        /* Glassmorphism Styles */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
        }

        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .dark .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(203, 213, 225, 0.6);
        }

        .dark .glass-input {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Ambient Animated Background Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.45;
            z-index: 0;
            pointer-events: none;
            animation: float 18s infinite alternate ease-in-out;
        }

        .orb-1 {
            top: -5%;
            left: -5%;
            width: 45vw;
            height: 45vw;
            background: radial-gradient(circle, #1a73e8 0%, #a142f4 100%);
        }

        .orb-2 {
            bottom: -10%;
            right: -5%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, #34a853 0%, #1a73e8 100%);
            animation-delay: -5s;
        }

        .orb-3 {
            top: 40%;
            left: 30%;
            width: 35vw;
            height: 35vw;
            background: radial-gradient(circle, #fbbc04 0%, #ea4335 100%);
            animation-delay: -10s;
            opacity: 0.25;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 40px) scale(1.08); }
            100% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* Number Input Spin Box Removal */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="min-h-full bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-300 relative overflow-x-hidden flex flex-col justify-between selection:bg-google-blue selection:text-white">

    <!-- Ambient Gradient Background Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Main Container -->
    <div class="relative z-10 w-full max-w-4xl mx-auto px-4 py-6 sm:px-6 sm:py-10 flex-1 flex flex-col justify-center">

        <!-- Top Header & Brand Bar -->
        <header class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6 sm:mb-8">
            <div class="flex items-center gap-3 text-center sm:text-left">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-google-blue via-google-purple to-google-red p-0.5 shadow-lg shadow-google-blue/20 shrink-0">
                    <div class="w-full h-full bg-white dark:bg-slate-900 rounded-[14px] flex items-center justify-center">
                        <i class="fa-solid fa-calculator text-transparent bg-clip-text bg-gradient-to-tr from-google-blue to-google-purple text-xl"></i>
                    </div>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight bg-gradient-to-r from-google-blue via-google-purple to-google-red bg-clip-text text-transparent">
                        SmartBudget Pro
                    </h1>
                    <p class="text-xs font-semibold text-slate-500 dark:text-slate-400">
                        Created by Mawethu Mpande <span class="text-google-blue font-bold">@SISONKE HUB</span>
                    </p>
                </div>
            </div>

            <!-- Workspace & Theme Controls -->
            <div class="flex items-center gap-2 bg-white/60 dark:bg-slate-900/60 p-1.5 rounded-2xl border border-white/40 dark:border-white/10 backdrop-blur-md shadow-sm">
                <!-- Workspace Switcher -->
                <div class="flex bg-slate-200/60 dark:bg-slate-800/60 p-1 rounded-xl">
                    <button id="mode-personal" onclick="setWorkspace('personal')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-white dark:bg-slate-700 text-google-blue shadow-sm">
                        <i class="fa-solid fa-user"></i>
                        <span>Personal</span>
                    </button>
                    <button id="mode-church" onclick="setWorkspace('church')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                        <i class="fa-solid fa-church"></i>
                        <span>Church</span>
                    </button>
                </div>

                <!-- Dark Mode Toggle -->
                <button onclick="toggleDarkMode()" aria-label="Toggle theme" class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-800 transition shadow-sm">
                    <i id="theme-icon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- Main Glassmorphic Calculator Card -->
        <main class="glass-panel rounded-3xl p-5 sm:p-8 shadow-2xl transition-all duration-300">
            
            <!-- Controls Section -->
            <div class="space-y-6">
                <!-- Amount Input Header -->
                <div>
                    <label for="budget-amount" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">
                        Enter Total Budget Amount (ZAR / R)
                    </label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-xl sm:text-2xl font-black text-slate-400 dark:text-slate-500 select-none">R</span>
                        <input 
                            type="number" 
                            id="budget-amount" 
                            oninput="calculateAllocations()" 
                            placeholder="0.00" 
                            min="0"
                            step="any"
                            class="glass-input w-full rounded-2xl pl-11 pr-24 py-3.5 sm:py-4 text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white placeholder-slate-300 dark:placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-google-blue transition-all"
                        >
                        <div class="absolute right-3 flex items-center gap-1">
                            <button onclick="clearAmount()" class="px-3 py-1.5 text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-google-red dark:hover:text-google-red transition rounded-lg hover:bg-slate-200/50 dark:hover:bg-slate-800/50">
                                Reset
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Budgeting Rule Selector -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="rule-select" class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                            Select Allocation Strategy
                        </label>
                        <span id="rule-description" class="text-xs font-medium text-google-blue dark:text-blue-400 hidden sm:inline-block">
                            <!-- Rule tag will update here -->
                        </span>
                    </div>
                    
                    <select 
                        id="rule-select" 
                        onchange="calculateAllocations()" 
                        class="glass-input w-full rounded-2xl px-4 py-3.5 text-sm sm:text-base font-semibold text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-google-blue transition-all cursor-pointer"
                    >
                        <!-- Options populated dynamically based on active workspace -->
                    </select>
                </div>
            </div>

            <!-- Calculated Results Section -->
            <div class="mt-8 pt-6 border-t border-slate-200/60 dark:border-slate-800">
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4">
                    <div>
                        <h2 class="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <i class="fa-solid fa-chart-pie text-google-blue"></i>
                            Category Allocation Breakdown
                        </h2>
                    </div>

                    <!-- Verification Badge -->
                    <div id="verification-badge" class="px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-2 transition-all bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20">
                        <i class="fa-solid fa-circle-check"></i>
                        <span id="verification-text">Allocations Total: R 0.00 (100% Balanced)</span>
                    </div>
                </div>

                <!-- Category Breakdown Grid / Cards -->
                <div id="category-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5">
                    <!-- Dynamic Category Cards injected via JavaScript -->
                </div>

                <!-- Action Button Strip -->
                <div class="mt-6 flex flex-col sm:flex-row items-center justify-between gap-3 pt-4 border-t border-slate-200/40 dark:border-slate-800/60">
                    <div class="text-xs text-slate-500 dark:text-slate-400 text-center sm:text-left">
                        Calculations strictly execute locally on device.
                    </div>

                    <button 
                        onclick="copyResultsToClipboard()" 
                        class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-gradient-to-r from-google-blue to-google-purple hover:opacity-95 text-white font-bold text-xs sm:text-sm shadow-lg shadow-google-blue/20 active:scale-95 transition-all flex items-center justify-center gap-2 cursor-pointer"
                    >
                        <i class="fa-solid fa-copy"></i>
                        <span>Copy Allocation Summary</span>
                    </button>
                </div>
            </div>
        </main>

        <!-- Footer Notice & Copyright -->
        <footer class="mt-8 text-center space-y-1">
            <p class="text-xs font-semibold text-slate-500 dark:text-slate-400">
                SmartBudget Pro &bull; South African Rand (ZAR)
            </p>
            <p class="text-[11px] text-slate-400 dark:text-slate-500">
                Created Mawethu Mpande <span class="font-bold text-google-blue">@SISONKE HUB</span>
            </p>
        </footer>
    </div>

    <!-- Notification Toast Element -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <div class="glass-panel px-4 py-3 rounded-2xl shadow-2xl border border-white/20 flex items-center gap-3 text-slate-900 dark:text-white">
            <div id="toast-icon" class="w-8 h-8 rounded-xl bg-google-green/20 text-google-green flex items-center justify-center shrink-0">
                <i class="fa-solid fa-check"></i>
            </div>
            <span id="toast-message" class="text-xs sm:text-sm font-bold">Copied to clipboard!</span>
        </div>
    </div>

    <!-- APPLICATION LOGIC -->
    <script>
        // Preset Rules Definitions for Personal & Church Workspaces
        const BUDGET_RULES = {
            personal: [
                {
                    id: '50_30_20',
                    name: '50/30/20 Rule (Needs, Wants, Savings)',
                    description: '50% Essential Needs, 30% Discretionary Wants, 20% Financial Savings',
                    categories: [
                        { name: 'Essential Needs', pct: 50, color: 'from-google-blue to-blue-600', icon: 'fa-house' },
                        { name: 'Wants & Lifestyle', pct: 30, color: 'from-google-purple to-purple-600', icon: 'fa-bag-shopping' },
                        { name: 'Savings & Investments', pct: 20, color: 'from-google-green to-emerald-600', icon: 'fa-piggy-bank' }
                    ]
                },
                {
                    id: '70_20_10',
                    name: '70/20/10 Rule (Living, Savings, Giving)',
                    description: '70% Living Expenses, 20% Savings & Debt, 10% Tithe & Giving',
                    categories: [
                        { name: 'Living Expenses', pct: 70, color: 'from-google-blue to-blue-600', icon: 'fa-wallet' },
                        { name: 'Savings & Debt Payoff', pct: 20, color: 'from-google-green to-emerald-600', icon: 'fa-chart-line' },
                        { name: 'Giving & Tithes', pct: 10, color: 'from-google-yellow to-amber-600', icon: 'fa-hand-holding-heart' }
                    ]
                },
                {
                    id: '60_30_10',
                    name: '60/30/10 Rule (Essential, Discretionary, Future)',
                    description: '60% Essential Living, 30% Discretionary Spend, 10% Future Wealth',
                    categories: [
                        { name: 'Essential Living', pct: 60, color: 'from-google-blue to-blue-600', icon: 'fa-shield-halved' },
                        { name: 'Discretionary Spend', pct: 30, color: 'from-google-purple to-purple-600', icon: 'fa-face-smile' },
                        { name: 'Future & Reserve', pct: 10, color: 'from-google-green to-emerald-600', icon: 'fa-vault' }
                    ]
                },
                {
                    id: '80_20',
                    name: '80/20 Rule (Living Expenses & Savings)',
                    description: '80% All Living Expenses, 20% Priority Savings',
                    categories: [
                        { name: 'Living Expenses', pct: 80, color: 'from-google-blue to-blue-600', icon: 'fa-coins' },
                        { name: 'Priority Savings', pct: 20, color: 'from-google-green to-emerald-600', icon: 'fa-seedling' }
                    ]
                },
                {
                    id: 'zero_based',
                    name: 'Zero-Based Budgeting (100% Assigned)',
                    description: '50% Essentials, 30% Debt/Savings, 20% Personal & Giving',
                    categories: [
                        { name: 'Essential Obligations', pct: 50, color: 'from-google-blue to-blue-600', icon: 'fa-list-check' },
                        { name: 'Debt Payoff & Savings', pct: 30, color: 'from-google-green to-emerald-600', icon: 'fa-scale-balanced' },
                        { name: 'Personal & Giving', pct: 20, color: 'from-google-purple to-purple-600', icon: 'fa-heart' }
                    ]
                },
                {
                    id: 'pay_first',
                    name: 'Pay-Yourself-First (Savings First)',
                    description: '30% Savings & Investment First, 70% General Living',
                    categories: [
                        { name: 'Savings & Wealth First', pct: 30, color: 'from-google-green to-emerald-600', icon: 'fa-gem' },
                        { name: 'Operating Expenses', pct: 70, color: 'from-google-blue to-blue-600', icon: 'fa-receipt' }
                    ]
                }
            ],
            church: [
                {
                    id: 'church_std',
                    name: 'Church Standard (Operations, Outreach, Building)',
                    description: '50% Ministries & Operations, 30% Missions & Outreach, 20% Reserve & Building',
                    categories: [
                        { name: 'Operations & Ministries', pct: 50, color: 'from-google-blue to-blue-600', icon: 'fa-church' },
                        { name: 'Outreach & Missions', pct: 30, color: 'from-google-purple to-purple-600', icon: 'fa-earth-africa' },
                        { name: 'Building & Reserve Fund', pct: 20, color: 'from-google-yellow to-amber-600', icon: 'fa-building' }
                    ]
                },
                {
                    id: 'church_evangelism',
                    name: 'Church Evangelism Focus (Outreach Heavy)',
                    description: '50% Outreach & Evangelism, 30% Operational Needs, 20% Emergency Reserve',
                    categories: [
                        { name: 'Outreach & Evangelism', pct: 50, color: 'from-google-purple to-purple-600', icon: 'fa-bullhorn' },
                        { name: 'Operational Needs', pct: 30, color: 'from-google-blue to-blue-600', icon: 'fa-sliders' },
                        { name: 'Emergency Reserve', pct: 20, color: 'from-google-green to-emerald-600', icon: 'fa-box-archive' }
                    ]
                }
            ]
        };

        // Current Application State
        let currentWorkspace = 'personal';
        let currentCalculatedResults = [];
        let currentTotalAmount = 0;

        // Initialize App on DOM Load
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            populateRuleSelector();
            calculateAllocations();
        });

        // Initialize Theme (Dark / Light)
        function initTheme() {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
            updateThemeIcon();
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const icon = document.getElementById('theme-icon');
            if (document.documentElement.classList.contains('dark')) {
                icon.className = 'fa-solid fa-sun text-google-yellow';
            } else {
                icon.className = 'fa-solid fa-moon text-slate-600';
            }
        }

        // Workspace Switcher (Personal vs Church)
        function setWorkspace(workspace) {
            currentWorkspace = workspace;
            
            const btnPersonal = document.getElementById('mode-personal');
            const btnChurch = document.getElementById('mode-church');

            if (workspace === 'personal') {
                btnPersonal.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-white dark:bg-slate-700 text-google-blue shadow-sm';
                btnChurch.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
            } else {
                btnChurch.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 bg-white dark:bg-slate-700 text-google-blue shadow-sm';
                btnPersonal.className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
            }

            populateRuleSelector();
            calculateAllocations();
        }

        // Populate Budget Rules Dropdown based on Active Workspace
        function populateRuleSelector() {
            const select = document.getElementById('rule-select');
            select.innerHTML = '';

            const rules = BUDGET_RULES[currentWorkspace];
            rules.forEach(rule => {
                const option = document.createElement('option');
                option.value = rule.id;
                option.textContent = rule.name;
                select.appendChild(option);
            });

            updateRuleDescription();
        }

        function updateRuleDescription() {
            const select = document.getElementById('rule-select');
            const descSpan = document.getElementById('rule-description');
            const rules = BUDGET_RULES[currentWorkspace];
            const activeRule = rules.find(r => r.id === select.value) || rules[0];

            if (activeRule) {
                descSpan.textContent = activeRule.description;
            }
        }

        // Main Allocation Calculation Function
        function calculateAllocations() {
            updateRuleDescription();

            const amountInput = document.getElementById('budget-amount');
            const rawAmount = parseFloat(amountInput.value);
            currentTotalAmount = isNaN(rawAmount) || rawAmount < 0 ? 0 : rawAmount;

            const select = document.getElementById('rule-select');
            const rules = BUDGET_RULES[currentWorkspace];
            const activeRule = rules.find(r => r.id === select.value) || rules[0];

            const grid = document.getElementById('category-grid');
            grid.innerHTML = '';

            let accumulatedAllocations = 0;
            currentCalculatedResults = [];

            activeRule.categories.forEach((cat, index) => {
                let allocatedAmount = 0;

                // Handle exact rounding for final item to guarantee 100% sum equality
                if (index === activeRule.categories.length - 1) {
                    allocatedAmount = currentTotalAmount - accumulatedAllocations;
                } else {
                    allocatedAmount = Math.round((currentTotalAmount * (cat.pct / 100)) * 100) / 100;
                    accumulatedAllocations += allocatedAmount;
                }

                // Ensure non-negative zero formatting
                allocatedAmount = Math.max(0, allocatedAmount);

                currentCalculatedResults.push({
                    name: cat.name,
                    percentage: cat.pct,
                    amount: allocatedAmount
                });

                // Render Glassmorphic Category Card
                const card = document.createElement('div');
                card.className = 'glass-card p-4 rounded-2xl transition-all hover:translate-y-[-2px] flex flex-col justify-between';
                card.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2.5">
                            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr ${cat.color} text-white flex items-center justify-center text-sm shadow-md shrink-0">
                                <i class="fa-solid ${cat.icon}"></i>
                            </div>
                            <div>
                                <h3 class="text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-100 leading-tight">${cat.name}</h3>
                                <span class="text-[11px] font-semibold text-slate-400 dark:text-slate-500">${cat.pct}% Allocation</span>
                            </div>
                        </div>
                    </div>
                    <div class="pt-2 border-t border-slate-200/40 dark:border-slate-800 flex items-baseline justify-between">
                        <span class="text-[11px] uppercase font-bold tracking-wider text-slate-400">Amount</span>
                        <span class="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white">
                            ${formatZAR(allocatedAmount)}
                        </span>
                    </div>
                `;
                grid.appendChild(card);
            });

            verifyAllocations();
        }

        // Exact Allocation Sum Verification
        function verifyAllocations() {
            const sum = currentCalculatedResults.reduce((acc, curr) => acc + curr.amount, 0);
            const badge = document.getElementById('verification-badge');
            const badgeText = document.getElementById('verification-text');

            const isExact = Math.abs(sum - currentTotalAmount) < 0.01;

            if (isExact) {
                badge.className = 'px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-2 transition-all bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20';
                badgeText.textContent = `Allocations Total: ${formatZAR(sum)} (100% Balanced)`;
            } else {
                badge.className = 'px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-2 transition-all bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/20';
                badgeText.textContent = `Total: ${formatZAR(sum)} / Target: ${formatZAR(currentTotalAmount)}`;
            }
        }

        // ZAR Currency Formatter
        function formatZAR(amount) {
            return new Intl.NumberFormat('en-ZA', {
                style: 'currency',
                currency: 'ZAR',
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(amount).replace('ZAR', 'R');
        }

        // Input Reset Helper
        function clearAmount() {
            const amountInput = document.getElementById('budget-amount');
            amountInput.value = '';
            calculateAllocations();
            amountInput.focus();
        }

        // Copy Results Summary to Clipboard
        function copyResultsToClipboard() {
            if (currentTotalAmount <= 0) {
                showToast('Please enter an amount to copy allocations.', true);
                return;
            }

            const select = document.getElementById('rule-select');
            const activeRuleName = select.options[select.selectedIndex].text;

            let summaryText = `*SmartBudget Pro — Allocation Summary*\n`;
            summaryText += `Workspace: ${currentWorkspace.toUpperCase()}\n`;
            summaryText += `Total Budget: ${formatZAR(currentTotalAmount)}\n`;
            summaryText += `Rule: ${activeRuleName}\n`;
            summaryText += `------------------------------------\n`;

            currentCalculatedResults.forEach(item => {
                summaryText += `• ${item.name} (${item.percentage}%): ${formatZAR(item.amount)}\n`;
            });

            summaryText += `------------------------------------\n`;
            summaryText += `Allocations Total: ${formatZAR(currentTotalAmount)} (100% Verified)\n`;
            summaryText += `Created via SmartBudget Pro @SISONKE HUB`;

            // Fallback clipboard copying mechanism for frame compatibility
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(summaryText)
                    .then(() => showToast('Allocations copied to clipboard!'))
                    .catch(() => fallbackCopy(summaryText));
            } else {
                fallbackCopy(summaryText);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-9999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('Allocations copied to clipboard!');
            } catch (err) {
                showToast('Failed to copy allocations.', true);
            }
            document.body.removeChild(textArea);
        }

        // Toast Notification System
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMessage.textContent = message;

            if (isError) {
                toastIcon.className = 'w-8 h-8 rounded-xl bg-google-red/20 text-google-red flex items-center justify-center shrink-0';
                toastIcon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            } else {
                toastIcon.className = 'w-8 h-8 rounded-xl bg-google-green/20 text-google-green flex items-center justify-center shrink-0';
                toastIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
